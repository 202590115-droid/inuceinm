<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КОСМИЧЕСКАЯ ЛЮБОВЬ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a1a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
            position: relative;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 600px;
            border: 3px solid #4ecdc4;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(78, 205, 196, 0.3);
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3a 100%);
            display: block;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 26, 0.95);
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        #startScreen {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        #gameOverScreen {
            display: none;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ffa36c, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #4ecdc4;
        }

        button {
            background: linear-gradient(45deg, #ff6b6b, #ffa36c);
            border: none;
            border-radius: 25px;
            color: white;
            padding: 12px 35px;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 10px;
            min-height: 44px;
            min-width: 140px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin: 10px 0;
            align-items: center;
        }

        .control-key {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: bold;
        }

        .stats {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.9rem;
            z-index: 5;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 10px;
        }

        .relationship-bar {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 130px;
            height: 18px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            z-index: 5;
        }

        .relationship-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffa36c, #4ecdc4);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .final-stats {
            text-align: center;
            margin: 15px 0;
        }

        .stat-value {
            font-size: 1.8rem;
            color: #ffa36c;
            margin: 8px 0;
        }

        .message {
            font-size: 0.95rem;
            text-align: center;
            margin: 12px 0;
            max-width: 90%;
            line-height: 1.4;
            color: #a5b1c2;
        }

        .hint {
            color: #ffa36c;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .back-btn {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }

        .pause-btn {
            position: absolute;
            top: 50px;
            left: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            z-index: 5;
            font-size: 0.8rem;
        }

        /* Улучшенное мобильное управление */
        .mobile-controls {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 15;
            pointer-events: none;
        }

        .mobile-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: 2px solid #4ecdc4;
            color: white;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            pointer-events: auto;
        }

        .shield-btn {
            background: rgba(78, 205, 196, 0.25);
            font-size: 1.6rem;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
            h1 { font-size: 1.8rem; }
            .subtitle { font-size: 0.95rem; }
            button { padding: 10px 25px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div class="stats">
            <div>Очки: <span id="score">0</span></div>
            <div>Время: <span id="time">60</span>с</div>
        </div>

        <div class="relationship-bar">
            <div class="relationship-fill" id="relationshipBar" style="width: 50%"></div>
        </div>

        <button class="pause-btn" id="backBtn">← Меню</button>

        <div class="mobile-controls">
            <div class="mobile-btn" id="leftBtn">←</div>
            <div class="mobile-btn shield-btn" id="shieldBtn">🛡</div>
            <div class="mobile-btn" id="rightBtn">→</div>
        </div>

        <div class="screen" id="startScreen">
            <h1>КОСМИЧЕСКАЯ ЛЮБОВЬ</h1>
            <div class="subtitle">EXY ❤️ ФАРАНГИЗ</div>
            <p class="message">
                EXY и Фарангиз встретились в космосе!<br>
                Помоги им избегать проблем и собирать моменты счастья!
            </p>
            <div class="hint">(найди нужные фигуры и будь осторожен любимый<3)</div>

            <div class="controls">
                <div class="control-key">← → / Свайп</div>
                <div>Движение</div>
            </div>
            <div class="controls">
                <div class="control-key">ПРОБЕЛ / 🛡</div>
                <div>Защита</div>
            </div>

            <button id="startBtn">СТАРТ</button>
        </div>

        <div class="screen" id="gameOverScreen">
            <h1>ИГРА ОКОНЧЕНА</h1>
            <div class="final-stats">
                <div>Ваш счет:</div>
                <div class="stat-value" id="finalScore">0</div>
                <div>Уровень отношений:</div>
                <div class="stat-value" id="finalRelationship">50%</div>
            </div>
            <p class="message" id="endMessage"></p>
            <div class="controls">
                <button id="restartBtn">ИГРАТЬ СНОВА</button>
                <button class="back-btn" id="menuBtn">МЕНЮ</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function setupCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            if(player) {
                player.y = canvas.height - 100;
            }
        }

        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const menuBtn = document.getElementById('menuBtn');
        const backBtn = document.getElementById('backBtn');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const relationshipBar = document.getElementById('relationshipBar');
        const finalScoreEl = document.getElementById('finalScore');
        const finalRelationshipEl = document.getElementById('finalRelationship');
        const endMessageEl = document.getElementById('endMessage');

        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const shieldBtn = document.getElementById('shieldBtn');

        let score = 0;
        let gameTime = 60;
        let relationship = 50;
        let gameActive = false;
        let gameLoop;

        const player = {
            x: 150,
            y: 400,
            width: 45,
            height: 45,
            speed: 6,
            color: '#4ecdc4',
            isShielding: false,
            shieldTime: 0
        };

        let hearts = []; 
        let problems = []; 
        let particles = []; 
        let stars = []; 

        let mobileKeys = { left: false, right: false };

        function setupMobileControls() {
            leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); mobileKeys.left = true; }, {passive: false});
            leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); mobileKeys.left = false; }, {passive: false});
            rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); mobileKeys.right = true; }, {passive: false});
            rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); mobileKeys.right = false; }, {passive: false});
            shieldBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (gameActive) activateShield(); }, {passive: false});
        }

        function activateShield() {
            if(!player.isShielding) {
                player.isShielding = true;
                player.shieldTime = 40; 
            }
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < 40; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.6 + 0.2
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }

        function createHeart() {
            hearts.push({
                x: Math.random() * (canvas.width - 30),
                y: -30,
                width: 25,
                height: 25,
                speed: 2 + Math.random() * 2.5,
                color: '#ff6b6b'
            });
        }

        function createProblem() {
            const types = [
                { color: '#ff4757', speed: 3.5, size: 35 }, 
                { color: '#ffa502', speed: 2.5, size: 28 }, 
                { color: '#2ed573', speed: 1.8, size: 22 }
            ];
            const type = types[Math.floor(Math.random() * types.length)];
            problems.push({
                x: Math.random() * (canvas.width - type.size),
                y: -type.size,
                width: type.size,
                height: type.size,
                speed: type.speed,
                color: type.color
            });
        }

        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    size: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 5,
                    speedY: (Math.random() - 0.5) * 5,
                    color: color,
                    life: 1
                });
            }
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width/2, player.y + player.height/2);
            
            // Защитный купол
            if (player.isShielding) {
                ctx.strokeStyle = 'rgba(78, 205, 196, ' + (player.shieldTime / 40) + ')';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, player.width * 1.1, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Иконка игрока (Розовое сердечко)
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = player.color;
            ctx.fillRect(-player.width/3, -player.width/3, player.width * 0.7, player.width * 0.7);
            ctx.beginPath();
            ctx.arc(0, -player.width/3, player.width * 0.35, 0, Math.PI * 2);
            ctx.arc(-player.width/3, 0, player.width * 0.35, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();

            ctx.fillStyle = 'white';
            ctx.font = 'bold 11px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('EXY & Фарангиз', player.x + player.width/2, player.y + player.height + 18);
        }

        function drawHearts() {
            for (let i = hearts.length - 1; i >= 0; i--) {
                const heart = hearts[i];
                ctx.fillStyle = heart.color;
                
                // Рисуем маленькое красивое сердечко
                ctx.save();
                ctx.translate(heart.x + 12, heart.y + 12);
                ctx.beginPath();
                ctx.moveTo(0, -5);
                ctx.bezierCurveTo(5, -12, 15, -5, 0, 8);
                ctx.bezierCurveTo(-15, -5, -5, -12, 0, -5);
                ctx.fill();
                ctx.restore();

                heart.y += heart.speed;

                if (checkCollision(player, heart)) {
                    hearts.splice(i, 1);
                    score += 10;
                    relationship = Math.min(100, relationship + 5);
                    createParticles(heart.x + 12, heart.y + 12, '#ff6b6b', 12);
                    continue;
                }

                if (heart.y > canvas.height) {
                    hearts.splice(i, 1);
                }
            }
        }

        function drawProblems() {
            for (let i = problems.length - 1; i >= 0; i--) {
                const problem = problems[i];
                ctx.fillStyle = problem.color;
                ctx.beginPath();
                ctx.moveTo(problem.x + problem.width/2, problem.y);
                ctx.lineTo(problem.x + problem.width, problem.y + problem.height/2);
                ctx.lineTo(problem.x + problem.width/2, problem.y + problem.height);
                ctx.lineTo(problem.x, problem.y + problem.height/2);
                ctx.closePath();
                ctx.fill();

                problem.y += problem.speed;

                if (checkCollision(player, problem)) {
                    if (player.isShielding) {
                        problems.splice(i, 1);
                        createParticles(problem.x + problem.width/2, problem.y + problem.height/2, '#4ecdc4', 15);
                        score += 5;
                    } else {
                        problems.splice(i, 1);
                        relationship -= 10;
                        createParticles(problem.x + problem.width/2, problem.y + problem.height/2, problem.color, 12);
                        if (relationship <= 0) gameOver();
                    }
                    continue;
                }

                if (problem.y > canvas.height) {
                    problems.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= 0.025;
                if (p.life <= 0) particles.splice(i, 1);
            }
            ctx.globalAlpha = 1;
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.code === 'Space' && gameActive) {
                e.preventDefault();
                activateShield();
            }
        });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });

        function handleInput() {
            if (keys['ArrowLeft'] || keys['a'] || keys['Ф'] || keys['ф'] || mobileKeys.left) {
                player.x = Math.max(0, player.x - player.speed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['В'] || keys['в'] || mobileKeys.right) {
                player.x = Math.min(canvas.width - player.width, player.x + player.speed);
            }

            if (player.isShielding) {
                player.shieldTime--;
                if (player.shieldTime <= 0) player.isShielding = false;
            }
        }

        function updateGame() {
            handleInput();
            if (Math.random() < 0.025) createHeart();
            if (Math.random() < 0.035) createProblem();

            gameTime -= 1/60;
            if (gameTime <= 0) gameOver();

            scoreEl.textContent = score;
            timeEl.textContent = Math.ceil(gameTime);
            relationshipBar.style.width = relationship + '%';
        }

        function game() {
            if (!gameActive) return;
            ctx.fillStyle = 'rgba(10, 10, 26, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawStars();
            drawHearts();
            drawProblems();
            drawParticles();
            drawPlayer();
            updateGame();

            gameLoop = requestAnimationFrame(game);
        }

        function startGame() {
            setupCanvas();
            score = 0;
            gameTime = 60;
            relationship = 50;
            gameActive = true;
            hearts = [];
            problems = [];
            particles = [];
            player.x = canvas.width / 2 - player.width/2;
            player.isShielding = false;

            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            createStars();
            gameLoop = requestAnimationFrame(game);
        }

        function gameOver() {
            gameActive = false;
            cancelAnimationFrame(gameLoop);
            finalScoreEl.textContent = score;
            finalRelationshipEl.textContent = relationship + '%';

            if (relationship >= 80) {
                endMessageEl.textContent = 'Идеальные отношения! EXY и Фарангиз счастливы вместе!';
            } else if (relationship >= 50) {
                endMessageEl.textContent = 'Хорошие отношения! Есть куда стремиться. ❤️';
            } else {
                endMessageEl.textContent = 'Сложные времена... Но любовь победит!';
            }
            gameOverScreen.style.display = 'flex';
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        menuBtn.addEventListener('click', () => {
            gameOverScreen.style.display = 'none';
            startScreen.style.display = 'flex';
        });
        backBtn.addEventListener('click', () => {
            if (gameActive) {
                gameActive = false;
                cancelAnimationFrame(gameLoop);
                startScreen.style.display = 'flex';
            }
        });

        createStars();
        setupMobileControls();
        window.addEventListener('load', setupCanvas);

        document.addEventListener('touchmove', (e) => {
            if (gameActive) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
