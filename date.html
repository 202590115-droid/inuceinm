<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Романтический вопрос 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink: #f48fb1;
    --purple: #ce93d8;
    --deep: #7b3fa0;
    --soft: #e1bee7;
  }

  html, body {
    width: 100%; height: 100%;
  }

  /* ── PAGE 1 ── */
  #page1 {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd9 20%, #e1bee7 50%, #ce93d8 75%, #b39ddb 100%);
    font-family: 'Lato', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .hearts-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .heart-float {
    position: absolute;
    opacity: 0.15;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.15; }
    90%  { opacity: 0.15; }
    100% { transform: translateY(-10vh) rotate(20deg); opacity: 0; }
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(16px);
    border-radius: 32px;
    padding: 3rem 2.5rem;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow:
      0 8px 40px rgba(206, 147, 216, 0.35),
      0 2px 12px rgba(206, 147, 216, 0.2),
      inset 0 1px 0 rgba(255,255,255,0.9);
    animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .emoji-big {
    font-size: 3.5rem;
    display: block;
    margin-bottom: 1.2rem;
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.12); }
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.45rem;
    color: #7b3fa0;
    line-height: 1.55;
    margin-bottom: 0.5rem;
    font-style: italic;
    font-weight: 400;
  }

  .subtitle {
    font-size: 0.8rem;
    color: #c084d6;
    margin-bottom: 2.2rem;
    letter-spacing: 0.1em;
    font-weight: 300;
  }

  .buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
  }

  .btn {
    border: none;
    border-radius: 50px;
    padding: 0.75rem 2.2rem;
    font-size: 1rem;
    font-family: 'Playfair Display', serif;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.03em;
  }

  .btn-yes {
    background: linear-gradient(135deg, #ce93d8, #9c27b0);
    color: #fff;
    box-shadow: 0 4px 18px rgba(156, 39, 176, 0.4);
  }

  .btn-yes:hover {
    transform: scale(1.07);
    box-shadow: 0 6px 24px rgba(156, 39, 176, 0.5);
  }

  .btn-yes:active { transform: scale(0.97); }

  .btn-no {
    background: rgba(255,255,255,0.7);
    color: #b06fcf;
    border: 1.5px solid #e1bee7;
    box-shadow: 0 2px 10px rgba(200,120,220,0.15);
    position: fixed;
    transition: none;
    z-index: 999;
  }

  /* ── PAGE 2 ── */
  #page2 {
    display: none;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #1a0033 0%, #3b0a6b 40%, #6a1b9a 70%, #ce93d8 100%);
    position: relative;
    overflow: hidden;
  }

  #page2.active {
    display: flex;
  }

  .page2-card {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 3rem 2rem;
    max-width: 440px;
    width: 90%;
    animation: p2In 1s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes p2In {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .stars-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.8); }
    50%       { opacity: 0.9; transform: scale(1.3); }
  }

  .p2-emoji {
    font-size: 4rem;
    display: block;
    margin-bottom: 1.5rem;
    animation: floatEmoji 3s ease-in-out infinite;
  }

  @keyframes floatEmoji {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-12px); }
  }

  .p2-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-style: italic;
    color: #fff;
    line-height: 1.5;
    text-shadow: 0 2px 20px rgba(206, 147, 216, 0.6);
    margin-bottom: 1rem;
    animation: textGlow 2.5s ease-in-out infinite;
  }

  @keyframes textGlow {
    0%, 100% { text-shadow: 0 2px 20px rgba(206,147,216,0.4); }
    50%       { text-shadow: 0 2px 40px rgba(206,147,216,0.9), 0 0 60px rgba(206,147,216,0.3); }
  }

  .p2-sub {
    font-family: 'Lato', sans-serif;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.12em;
    font-weight: 300;
    margin-top: 1.5rem;
  }

  .p2-hearts {
    display: flex;
    justify-content: center;
    gap: 0.4rem;
    margin-top: 1.2rem;
    font-size: 1.4rem;
  }

  .p2-hearts span {
    animation: heartBeat 1.2s ease-in-out infinite;
  }

  .p2-hearts span:nth-child(2) { animation-delay: 0.2s; }
  .p2-hearts span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    30%       { transform: scale(1.3); }
    60%       { transform: scale(0.95); }
  }

  /* confetti */
  .confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
  }

  .c-piece {
    position: absolute;
    border-radius: 50%;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<!-- PAGE 1 -->
<div id="page1">
  <div class="hearts-bg" id="heartsBg"></div>

  <div class="card">
    <span class="emoji-big">💜</span>
    <h1>Лешенька, ты согласен встречаться со мной?</h1>
    <p class="subtitle">✦ &nbsp; с нежностью &nbsp; ✦</p>

    <div class="buttons" id="buttons">
      <button class="btn btn-yes" onclick="onYes()">Да 💕</button>
      <button class="btn btn-no" id="btnNo">Нет</button>
    </div>
  </div>
</div>

<!-- PAGE 2 -->
<div id="page2">
  <div class="stars-bg" id="starsBg"></div>
  <div class="confetti-container" id="confettiContainer"></div>

  <div class="page2-card">
    <span class="p2-emoji">💙</span>
    <div class="p2-title">Я так и знала,<br>что ты не откажешь</div>
    <div class="p2-hearts">
      <span>💜</span><span>💙</span><span>💜</span>
    </div>
    <p class="p2-sub">✦ &nbsp; навсегда &nbsp; ✦</p>
  </div>
</div>

<script>
  // Floating hearts on page 1
  const heartsBg = document.getElementById('heartsBg');
  const emojis = ['💜','🌸','💕','✨','🌷','💫','🩷','🫧'];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'heart-float';
    el.textContent = emojis[i % emojis.length];
    el.style.left = (Math.random() * 100) + '%';
    el.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
    el.style.animationDuration = (8 + Math.random() * 14) + 's';
    el.style.animationDelay = (Math.random() * 12) + 's';
    heartsBg.appendChild(el);
  }

  // Runaway "No" button
  const btnNo = document.getElementById('btnNo');
  let placed = false;

  function placeNoBtn() {
    if (!placed) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const bw = btnNo.offsetWidth || 90;
      const bh = btnNo.offsetHeight || 44;
      btnNo.style.left = (bw/2 + Math.random() * (vw - bw)) + 'px';
      btnNo.style.top  = (bh/2 + Math.random() * (vh - bh)) + 'px';
      btnNo.style.transform = 'translate(-50%, -50%)';
      placed = true;
    }
  }

  btnNo.addEventListener('mouseenter', function() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const bw = btnNo.offsetWidth, bh = btnNo.offsetHeight;
    let nx, ny, attempts = 0;
    do {
      nx = bw/2 + Math.random() * (vw - bw);
      ny = bh/2 + Math.random() * (vh - bh);
      attempts++;
    } while (attempts < 20 && Math.hypot(nx - parseFloat(btnNo.style.left), ny - parseFloat(btnNo.style.top)) < 120);
    btnNo.style.left = nx + 'px';
    btnNo.style.top  = ny + 'px';
  });

  btnNo.addEventListener('touchstart', function(e) {
    e.preventDefault();
    const vw = window.innerWidth, vh = window.innerHeight;
    const bw = btnNo.offsetWidth, bh = btnNo.offsetHeight;
    btnNo.style.left = (bw/2 + Math.random() * (vw - bw)) + 'px';
    btnNo.style.top  = (bh/2 + Math.random() * (vh - bh)) + 'px';
  }, { passive: false });

  placeNoBtn();
  window.addEventListener('resize', function() { placed = false; placeNoBtn(); });

  // YES button
  function onYes() {
    // Spawn confetti briefly on page 1
    spawnConfetti(document.body);
    setTimeout(function() {
      document.getElementById('page1').style.display = 'none';
      const p2 = document.getElementById('page2');
      p2.classList.add('active');
      buildStars();
      setTimeout(function() { spawnConfetti(document.getElementById('confettiContainer')); }, 300);
    }, 400);
  }

  function spawnConfetti(parent) {
    const colors = ['#ce93d8','#f48fb1','#b39ddb','#80deea','#fff176','#f8bbd9','#a5d6a7','#ffffff'];
    for (let i = 0; i < 100; i++) {
      const el = document.createElement('div');
      el.className = 'c-piece';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.left = (Math.random() * 100) + 'vw';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
      const size = (6 + Math.random() * 9) + 'px';
      el.style.width = el.style.height = size;
      el.style.animationDuration = (1.8 + Math.random() * 2.5) + 's';
      el.style.animationDelay = (Math.random() * 0.8) + 's';
      parent.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  function buildStars() {
    const sb = document.getElementById('starsBg');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = (1 + Math.random() * 3) + 'px';
      s.style.width = s.style.height = size;
      s.style.left = (Math.random() * 100) + '%';
      s.style.top  = (Math.random() * 100) + '%';
      s.style.animationDuration = (2 + Math.random() * 4) + 's';
      s.style.animationDelay = (Math.random() * 4) + 's';
      sb.appendChild(s);
    }
  }
</script>
</body>
</html>
